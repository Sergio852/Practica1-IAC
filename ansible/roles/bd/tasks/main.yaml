# Instala MariaDB y la configura para escuchar solo en la red de datos
- name: Instalar MariaDB y la librería de Python para gestionarla
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present
    lock_timeout: 300

- name: Hacer que MariaDB escuche solo en la IP de la red de datos
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address'
    line: "bind-address            = {{ mariadb_bind_address }}"
  notify: Reiniciar MariaDB

- name: Asegurar que MariaDB está arrancado y habilitado
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Crear la base de datos de la aplicación
  community.mysql.mysql_db:
    name: "{{ bd_nombre }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Crear el usuario de la aplicación, solo accesible desde cada servidor web
  community.mysql.mysql_user:
    name: "{{ bd_usuario }}"
    host: "{{ item }}"
    password: "{{ bd_password }}"
    priv: "{{ bd_nombre }}.*:SELECT,INSERT,UPDATE,DELETE"
    column_case_sensitive: true
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  loop: "{{ web_ips }}"
  no_log: true

- name: Descargar schema.sql de la versión fijada de la aplicación
  ansible.builtin.get_url:
    url: "{{ app_raw_url }}/schema.sql"
    dest: /root/guestbook-schema.sql
    mode: "0600"

- name: Comprobar si las tablas de la aplicación ya existen
  community.mysql.mysql_query:
    login_db: information_schema
    query: "SELECT COUNT(*) AS n FROM tables WHERE table_schema = %s AND table_name = %s"
    positional_args:
      - "{{ bd_nombre }}"
      - "{{ app_tabla }}"
    login_unix_socket: /run/mysqld/mysqld.sock
  register: tablas_app
  changed_when: false

- name: Crear las tablas de la aplicación con schema.sql si no existen
  community.mysql.mysql_db:
    name: "{{ bd_nombre }}"
    state: import
    target: /root/guestbook-schema.sql
    login_unix_socket: /run/mysqld/mysqld.sock
  when: tablas_app.query_result[0][0].n | int == 0
