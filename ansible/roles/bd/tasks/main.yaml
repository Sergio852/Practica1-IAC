# Instala MariaDB y la configura para escuchar solo en la red de datos
- name: Instalar MariaDB y la librería de Python para gestionarla
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present
    lock_timeout: 300

- name: Hacer que MariaDB escuche solo en la IP de la red de datos
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address'
    line: "bind-address            = {{ mariadb_bind_address }}"
  notify: Reiniciar MariaDB

- name: Asegurar que MariaDB está arrancado y habilitado
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true
