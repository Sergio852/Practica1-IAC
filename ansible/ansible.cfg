[defaults]
# Inventario generado por Terraform/OpenTofu
inventory          = inventario.ini
roles_path         = roles
private_key_file   = ~/.ssh/id_rsa
host_key_checking  = False
interpreter_python = auto_silent

[ssh_connection]
# Las máquinas se recrean con cada destroy/apply y cambian de huella SSH:
# no guardamos sus claves para que no den error de "host key changed"
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True
