# PKI propia: se genera en mi equipo, en un directorio que no se sube al repositorio
pki_dir: "{{ playbook_dir }}/pki"
ca_nombre: "CA de Sergio"

# Nombre del virtual host al que sirve el proxy: el mismo que usa web
proxy_nombre: "{{ hostvars[groups['servidores_web'][0]]['vhost_nombre'] }}"

# IP de todas las webs en la red p1-front, tomadas del inventario: el proxy reparte entre ellas
web_front_ips: "{{ groups['servidores_web'] | map('extract', hostvars, 'ip_front') | list }}"

# Balanceo: fallos seguidos para dar una web por caída y tiempo que se queda fuera
balanceo_max_fallos: 2
balanceo_tiempo_fuera: 10s
# Tiempo máximo para conectar con una web antes de probar con otra
balanceo_tiempo_conexion: 2s

# HSTS: tiempo (en segundos) que el navegador recuerda que este sitio solo va por HTTPS
hsts_max_age: 300

# Caché de ficheros estáticos del proxy
cache_dir: /var/cache/nginx-estaticos
cache_max: 100m
cache_validez: 10m

# Límite de peticiones a /nuevo: tasa sostenida por IP y ráfaga permitida
limite_tasa: 1r/s
limite_rafaga: 5
# Panel de estado (Gatus): nombre público y dónde está, tomado del inventario
estado_nombre: "estado.sergiomesa.org"
docker_front_ip: "{{ hostvars[groups['servidores_docker'][0]]['ip_front'] }}"
docker_puerto: "{{ hostvars[groups['servidores_docker'][0]]['gatus_puerto'] }}"

# Sesiones persistentes: nombre de la cookie con la que el proxy reconoce a cada usuario
cookie_usuario: usuario_web
# Página de mantenimiento: se enseña si no responde ninguna web
mantenimiento_dir: /var/www/mantenimiento
