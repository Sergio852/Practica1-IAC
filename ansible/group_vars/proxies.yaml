# PKI propia: se genera en mi equipo, en un directorio que no se sube al repositorio
pki_dir: "{{ playbook_dir }}/pki"
ca_nombre: "CA de Sergio"

# Nombre del virtual host al que sirve el proxy: el mismo que usa web
proxy_nombre: "{{ hostvars[groups['servidores_web'][0]]['vhost_nombre'] }}"

# IP de web en la red p1-front (la que hay entre el proxy y web), tomada del inventario
web_front_ip: "{{ hostvars[groups['servidores_web'][0]]['ip_front'] }}"

# HSTS: tiempo (en segundos) que el navegador recuerda que este sitio solo va por HTTPS
hsts_max_age: 300

# Caché de ficheros estáticos del proxy
cache_dir: /var/cache/nginx-estaticos
cache_max: 100m
cache_validez: 10m

# Límite de peticiones a /nuevo: tasa sostenida por IP y ráfaga permitida
limite_tasa: 1r/s
limite_rafaga: 5
