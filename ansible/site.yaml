# Configuración del escenario del Proyecto 1

- name: Configuración común de todas las máquinas
  hosts: all
  become: true
  roles:
    - commons

- name: Servidor de base de datos
  hosts: servidores_bd
  become: true
  roles:
    - bd

- name: Servidor web
  hosts: servidores_web
  become: true
  roles:
    - web

- name: Proxy inverso
  hosts: proxies
  become: true
  roles:
    - proxy

- name: Servidor de contenedores
  hosts: servidores_docker
  become: true
  roles:
    - docker
    - estado
